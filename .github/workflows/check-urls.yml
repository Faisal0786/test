name: Check Provider URLs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-url-checker
  cancel-in-progress: false

jobs:
  check-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip curl_cffi cloudscraper

      - name: Start FlareSolverr (Cloudflare bypass via headless Chrome)
        run: |
          docker run -d --name flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            -e CAPTCHA_SOLVER=none \
            --restart=no \
            ghcr.io/flaresolverr/flaresolverr:latest

          echo "Waiting for FlareSolverr to become ready..."
          READY=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8191/health > /dev/null 2>&1; then
              echo "✅ FlareSolverr ready after ${i} attempts"
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" != "1" ]; then
            echo "⚠️ FlareSolverr did not become ready"
            docker logs flaresolverr || true
            exit 1
          fi

          curl -s http://localhost:8191/health

      - name: Run provider URL checker
        run: python .github/scripts/url-checker.py

      - name: Dump FlareSolverr logs on failure
        if: failure()
        run: docker logs flaresolverr || true

      - name: Stop FlareSolverr
        if: always()
        run: docker stop flaresolverr || true

      - name: Commit and push URL changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add urls.json

          if ! git diff --cached --quiet; then
            git commit -m "Update provider URLs [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes detected in urls.json"
          fi