name: Check Provider URLs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-url-checker
  cancel-in-progress: false

jobs:
  check-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run provider URL checker
        run: python .github/scripts/url-checker.py

      - name: Commit and push URL changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add urls.json

          if ! git diff --cached --quiet; then
            git commit -m "Update provider URLs [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes detected in urls.json"
          fi